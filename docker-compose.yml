name: dealerfleet

services:
  postgres:
    image: postgres:17-alpine
    container_name: dealerfleet-postgres
    environment:
      POSTGRES_DB: dealerfleet
      POSTGRES_USER: dealerfleet
      POSTGRES_PASSWORD: dealerfleet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealerfleet -d dealerfleet"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: dealerfleet-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/dealerfleet
      DB_USER: dealerfleet
      DB_PASSWORD: dealerfleet
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      SEED_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SWAGGER_URL: http://localhost:8080/swagger-ui.html
        VITE_COVERAGE_URL: /coverage/
    container_name: dealerfleet-frontend
    ports:
      - "3000:80"
    volumes:
      - ./backend/target/site/jacoco:/usr/share/nginx/html/coverage/api:ro
      - ./frontend/coverage:/usr/share/nginx/html/coverage/web:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
