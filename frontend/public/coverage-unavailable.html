<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Relatório não gerado — DealerFleet</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      .card {
        max-width: 36rem;
        width: 100%;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 0.75rem;
        box-shadow: 0 1px 3px rgb(15 23 42 / 0.08);
        padding: 2rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.25rem; letter-spacing: -0.01em; }
      p { margin: 0 0 1rem; color: #475569; font-size: 0.925rem; }
      h2 {
        margin: 1.25rem 0 0.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #64748b;
      }
      pre {
        margin: 0;
        padding: 0.8rem 1rem;
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 0.5rem;
        font-size: 0.83rem;
        overflow-x: auto;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.55rem 1rem;
        background: #4f46e5;
        color: #fff;
        border-radius: 0.375rem;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Relatório de cobertura ainda não gerado</h1>
      <p>
        Os relatórios são produzidos ao rodar os testes. Execute a suíte correspondente e
        recarregue esta página.
      </p>

      <h2>Backend — JaCoCo</h2>
      <pre>cd backend
./mvnw test</pre>

      <h2>Frontend — Vitest</h2>
      <pre>cd frontend
yarn test:coverage</pre>

      <a href="/coverage/">← Voltar</a>
    </div>
  </body>
</html>
